<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Markets Live Beta</title>
  <style>
    body{font-family:Arial,sans-serif;background:#07101d;color:#eef5ff;margin:0;padding:24px}
    .wrap{max-width:1280px;margin:auto}
    .hero,.card{background:#0f1b31;border:1px solid #22365d;border-radius:16px;padding:18px;margin-bottom:16px}
    .small{font-size:12px;color:#8ea4ca}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
    .market{background:#0a1323;border:1px solid #22365d;border-radius:14px;padding:14px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#13203a;border:1px solid #22365d;font-size:11px;margin-right:6px}
    button{padding:10px 14px;border:none;border-radius:10px;background:#3b82f6;color:white;font-weight:bold;cursor:pointer}
    pre{white-space:pre-wrap;background:#0a1323;border:1px solid #22365d;border-radius:10px;padding:12px;overflow:auto}
    h1,h2,h3{margin-top:0}
    .muted{color:#9fb2d6}
    .price{font-size:24px;font-weight:700}
    .spread{font-size:13px;color:#8ea4ca}
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Weather Markets Live Beta</h1>
    <div class="small">Detroit weather, precipitation, tornado, and ancestry market dashboard.</div>
    <div style="margin-top:10px">
      <span class="pill">Weather</span>
      <span class="pill">Detroit Precipitation</span>
      <span class="pill">Tornado</span>
      <span class="pill">Ancestry</span>
      <span class="pill">Live Polling</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button onclick="loadHealth()">Health</button>
      <button onclick="loadReadiness()">Readiness</button>
      <button onclick="loadMarkets()">Refresh Markets</button>
      <button onclick="toggleAutoRefresh()">Toggle Auto Refresh</button>
    </div>
  </div>

  <div class="card">
    <h2>System Status</h2>
    <div class="grid">
      <div>
        <h3>Health</h3>
        <pre id="healthBox">No request made yet.</pre>
      </div>
      <div>
        <h3>Readiness</h3>
        <pre id="readinessBox">No request made yet.</pre>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Markets</h2>
    <div class="small">Live market cards grouped by market family.</div>
    <div id="marketGroups"></div>
  </div>
</div>

<script>
let autoRefresh = null;

function familyOrder(market){
  if (market.market_type === 'detroit_precipitation') return 'Detroit Precipitation';
  if (market.market_family === 'weather') return 'Weather';
  if (market.market_family === 'tornado') return 'Tornado';
  if (market.market_family === 'ancestry') return 'Ancestry';
  return 'Other';
}

function renderMarkets(markets){
  const grouped = {};
  for(const m of markets){
    const key = familyOrder(m);
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(m);
  }

  const order = ['Weather','Detroit Precipitation','Tornado','Ancestry','Other'];
  const html = order
    .filter(k => grouped[k] && grouped[k].length)
    .map(group => `
      <div class="card">
        <h3>${group}</h3>
        <div class="grid">
          ${grouped[group].map(m => `
            <div class="market">
              <div class="small">${m.market_family} • ${m.market_type}</div>
              <div style="margin:8px 0 10px 0"><strong>${m.label}</strong></div>
              <div class="price">${m.price}¢</div>
              <div class="spread">Bid ${m.bid} / Ask ${m.ask}</div>
              <div class="small" style="margin-top:10px">${m.market_id}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

  document.getElementById('marketGroups').innerHTML = html || '<div class="muted">No markets returned.</div>';
}

async function loadHealth(){
  const res = await fetch('/api/health');
  document.getElementById('healthBox').textContent = await res.text();
}

async function loadReadiness(){
  const res = await fetch('/api/readiness-summary');
  document.getElementById('readinessBox').textContent = await res.text();
}

async function loadMarkets(){
  const res = await fetch('/api/markets');
  const data = await res.json();
  renderMarkets(data.markets || []);
}

function toggleAutoRefresh(){
  if(autoRefresh){
    clearInterval(autoRefresh);
    autoRefresh = null;
  } else {
    autoRefresh = setInterval(loadMarkets, 10000);
  }
}

loadHealth();
loadReadiness();
loadMarkets();
</script>
</body>
</html>
